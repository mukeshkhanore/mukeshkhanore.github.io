max_retries = 3
timeout = 20
include_mail = false

# Strings, not integers. lychee rejects `accept = [200, 429]` as a type error
# and exits before checking anything, which is why every run failed in under
# ten seconds without reporting a single broken link.
accept = ["200", "203", "206", "429"]

exclude = [
  # ── Not links at all ──────────────────────────────────────────────────
  # The Content-Security-Policy meta tag lists allowed origins, and lychee
  # treats every "https://…" in the page as a link to fetch. A bare CDN or
  # analytics origin serves nothing at "/", so it 404s or 403s. These hosts
  # appear only in the CSP or as a script/style src.
  "^https://\\*\\.", # wildcard CSP entries, e.g. https://*.cookiefirst.com
  "googletagmanager\\.com",
  "google-analytics\\.com",
  "analytics\\.google\\.com",
  "consent-eu\\.cookiefirst\\.com", # per-site script; the bare origin 403s
  "cdn\\.cookiefirst\\.com",

  # ── Real links that reject automated traffic ──────────────────────────
  # doi.org redirects to the publisher (AIP, IOP, Springer) and those block
  # datacentre requests, so a failure here says nothing about whether the
  # link works in a browser.
  "^https://doi\\.org/",
  "^https://www\\.linkedin\\.com",
  "^https://www\\.researchgate\\.net",
  "^https://scholar\\.google\\.com",
  "^https://orcid\\.org",

  # TODO: delete this line once Assets/Mukesh_Khanore_CV.pdf is committed.
  "Mukesh_Khanore_CV\\.pdf",
]
