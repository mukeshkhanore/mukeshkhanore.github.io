name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run: a CDN file can change under a pinned SRI hash, which silently
  # blocks the resource. Catch it here rather than on the live site.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags. A tag like `v4` is mutable — if
# it were ever repointed at malicious code, that code would run here with the
# repository checked out. The trailing comment records which release each SHA
# is, since a bare SHA tells you nothing. To update: resolve the tag to its
# commit (`gh api repos/OWNER/REPO/git/ref/tags/vN`) and replace both.

jobs:
  checks:
    name: Format, HTML, integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # `ci` not `install`: installs exactly what package-lock.json pins, so a
      # compromised patch release cannot slip into the runner.
      - name: Install tooling
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Validate HTML
        run: npm run lint:html

      - name: Icon sprite is in sync
        run: node scripts/build-icons.js --check

      - name: Pre-rendered HTML matches data.js
        run: node scripts/prerender.js --check

      - name: Verify SRI and CSP hashes
        run: npm run integrity

      - name: Render smoke test
        run: npm test

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --root-dir is required because 404.html links to "/" and
          # "/Assets/style.css". Those absolute paths are deliberate — GitHub
          # Pages serves that page for URLs at any depth — but lychee cannot
          # resolve a root-relative link in a local file without being told
          # where the site root is.
          args: >-
            --config lychee.toml --no-progress
            --root-dir ${{ github.workspace }}
            index.html research.html cookie-policy.html 404.html Assets/data.js
          fail: true
